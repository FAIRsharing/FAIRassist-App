name: Documentation

on:
  push:
    branches-ignore:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          # Optional: Speeds up the workflow
          cache: 'npm'
      - name: Install Dependencies
        # 'npm ci' is strictly better than 'npm install' for pipelines
        run: npm ci
      - name: Run the documentation
        run: npm run doc:full
      - name: Commit generated documentation
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Autogenerated documentation files"
          file_pattern: "documentation/**"
